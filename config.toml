baseURL = 'https://thetoddluc.io/'
# languageCode = 'en-us'
language.locale = 'en-US' 
title = 'TheToddLuci0'
theme = 'ficurinia'

copyright = "TheToddLuci0"

[params]
logo = '/logo.png'
logoAltText = 'Logo'
favicon = '/favicon.png'
faviconIco = '/favicon.co'
appletouch = "/apple-touch-icon.png"
svgicon = "/logo.svg"
enableShareOnFediverse = true
fediverseAccount = "@TheToddLuci0@infosec.exchange"
[params.author]
  name = 'TheToddLuci0'

[menu]
[[menu.icons]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/TheToddLuci0"
    weight = 10
[[menu.icons]]
    identifier = "mastodon"
    name = "Mastodon"
    url = "https://infosec.exchange/@TheToddLuci0"

[outputs]
    home = ["HTML", "JSON", "rss"]

# Needed for GH Pages
# https://gohugo.io/host-and-deploy/host-on-github-pages/#step-5
[caches]
  [caches.images]
    dir = ':cacheDir/images'
